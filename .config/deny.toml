# cargo-deny configuration. Run with `cargo deny check`.

[graph]
all-features = true

[advisories]
# Advisories from the RustSec database fail the check unless listed here.
ignore = [
    # bincode 1.3.3 is unmaintained (not a vulnerability). syntect uses it only
    # to load the syntax sets built into this plugin, never untrusted input.
    # Lift when syntect (and two-face) stop depending on bincode 1, or when
    # this plugin moves off syntect.
    { id = "RUSTSEC-2025-0141", reason = "bincode via syntect: trusted embedded dumps only" },
]

[licenses]
# Licenses third-party dependencies may use.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
# Workspace crates are `publish = false`; their own license is set in Cargo.toml.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
